apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: finance-tracker
  namespace: finance-tracker-dev
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway-system
  hostnames:
    - finance.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: finance-tracker-frontend
          port: 3000