apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: finance-tracker
  namespace: finance-tracker-dev
spec:
  type: kv-v2
  vaultAuthRef: vault-auth
  mount: secret
  path: finance-tracker-dev
  destination:
    name: finance-tracker-secret
    create: true
  refreshAfter: 1h
