apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reminder-bot
  namespace: reminder-bot-prod
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway-system
  hostnames:
    - reminder-bot.home.arpa
    - reminder-bot-webhook.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: reminder-bot
          port: 8000