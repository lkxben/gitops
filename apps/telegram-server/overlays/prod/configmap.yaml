apiVersion: v1
kind: ConfigMap
metadata:
  name: telegram-server-config
  namespace: telegram-server-prod
data:
  ENVIRONMENT: "production"
  LOG_LEV: "info"
  LOG_JSON_FORMAT: "true"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_REQUEST_SIZE_LIMIT_MB: "1"
  API_RATE_LIMIT_PER_MINUTE: "1000"
  RABBITMQ_HOST: "192.168.20.70"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "telegram-server-prod"
  RABBITMQ_CONNECTION_ATTEMPTS: "3"
  RABBITMQ_CONNECTION_RETRY_DELAY: "2"
  TELEGRAM_API_URL: "https://api.telegram.org"
  TELEGRAM_TIMEOUT_SECONDS: "10"
  TELEGRAM_MAX_RETRIES: "3"
  TELEGRAM_WEBHOOK_URL: "https://headscale.tail6fccd5.ts.net/telegram/"
  WORKER_PREFETCH_COUNT: "10"
  WORKER_SHUTDOWN_TIMEOUT_SECONDS: "30"
  WORKER_MESSAGE_TTL_MS: "86400000"
  WORKER_MAX_DELIVERY_ATTEMPTS: "3"
  WORKER_RETRY_DELAY_MS: "5000"
  OTEL_SERVICE_NAME: "telegram-server"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-gateway-opentelemetry-collector.monitoring.svc.cluster.local:4317"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=prod,service.version=6915bc2"