apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  ports:
    - name: metrics
      port: 9221
      targetPort: 9221
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    kubernetes.io/service-name: pve-exporter
addressType: IPv4
ports:
  - name: metrics
    protocol: TCP
    port: 9221
endpoints:
  - addresses:
      - 192.168.10.2
    conditions:
      ready: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  endpoints:
    - port: metrics
      interval: 30s
      path: /pve
      params:
        module:
          - default