mode: deployment

replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.160.0

command:
  name: otelcol-contrib

serviceAccount:
  create: true
  automountServiceAccountToken: true

clusterRole:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
        - namespaces
        - nodes
      verbs:
        - get
        - list
        - watch

alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    k8sattributes:
      auth_type: serviceAccount
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.container.name
          - k8s.node.name

    batch: {}

  exporters:
    prometheus:
      endpoint: 0.0.0.0:8889

  service:
    extensions:
      - health_check
    pipelines:
      metrics:
        receivers:
          - otlp
        processors:
          - k8sattributes
          - batch
        exporters:
          - prometheus

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

  jaeger-compact:
    enabled: false

  jaeger-thrift:
    enabled: false

  jaeger-grpc:
    enabled: false

  zipkin:
    enabled: false

metrics:
  enabled: false