apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: "1.20.1"
      helm:
        valueFiles:
          - $values/apps/infrastructure/cilium/values.yaml

    - repoURL: https://github.com/lkxben/gitops.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true